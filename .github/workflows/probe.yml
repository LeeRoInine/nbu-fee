name: Probe NBU events pages (temporary)
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch event pages
        run: |
          UA="Mozilla/5.0 (compatible; nbu-feed/1.0; +https://github.com/LeeRoInine/nbu-fee)"
          mkdir probe && cd probe
          for id in 336 328; do curl -sSL -A "$UA" "https://bank.gov.ua/ua/research/events/$id" -o event-$id.html -w "event $id -> %{http_code} %{size_download}\n"; done
          curl -sSL -A "$UA" "https://bank.gov.ua/ua/research/events?category=3&page=2" -o events-3-p2.html -w "page2 -> %{http_code}\n"
      - name: Save probe files to the 'probe' branch
        run: |
          cd probe
          git init -q -b probe && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -q -m probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
